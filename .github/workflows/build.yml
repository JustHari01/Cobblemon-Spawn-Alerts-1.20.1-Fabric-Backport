name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fabric:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Report Gradle version
        run: gradle --version
      - name: Build Fabric release
        run: gradle :fabric:build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cobblemon-spawn-alerts-fabric-1.20.1
          path: fabric/build/libs/*1.20.1*.jar
          if-no-files-found: error
